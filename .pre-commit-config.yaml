# SAI ROLO TECH - PRE-COMMIT CONFIG
# Version: 1.0
# Purpose: File hygiene, secret scanning, and validation

repos:
  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=10000']
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Cursor/AI rules hardening (prevent hidden Unicode payloads)
  - repo: local
    hooks:
      - id: scan-ai-rules-unicode
        name: Scan .cursorrules/.cursor/rules for hidden Unicode
        entry: pwsh -NoProfile -File scripts/scan_rules_unicode.ps1
        language: system
        files: ^(\.cursorrules|\.cursor/rules/.*\.mdc)$

  # Secret scanning (Gitleaks integrated via pre-commit)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
