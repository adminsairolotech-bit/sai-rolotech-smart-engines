<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAI Rolotech Engine - 3D Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0f;
            color: #f1f5f9;
            overflow: hidden;
            height: 100vh;
        }

        /* Fullscreen 3D */
        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* HUD Overlay */
        .hud {
            position: fixed;
            z-index: 100;
            pointer-events: none;
        }

        .hud > * { pointer-events: auto; }

        /* Top Bar */
        .top-bar {
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(180deg, rgba(10,10,15,0.95) 0%, rgba(10,10,15,0) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-gear {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #6366f1, #22d3ee);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            animation: gearSpin 10s linear infinite;
            box-shadow: 0 0 30px rgba(99,102,241,0.5);
        }

        @keyframes gearSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .logo-text h1 {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(90deg, #fff, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text span {
            font-size: 0.75rem;
            color: #64748b;
        }

        /* Status Panel */
        .status-panel {
            display: flex;
            gap: 25px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: rgba(99,102,241,0.15);
            border: 1px solid rgba(99,102,241,0.3);
            border-radius: 25px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.green { background: #10b981; }
        .status-dot.cyan { background: #22d3ee; }
        .status-dot.yellow { background: #f59e0b; }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 10px currentColor; }
            50% { opacity: 0.5; box-shadow: 0 0 5px currentColor; }
        }

        /* Command Terminal */
        .command-terminal {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            width: 600px;
            background: rgba(18,18,26,0.95);
            border: 1px solid rgba(99,102,241,0.5);
            border-radius: 16px;
            padding: 5px;
            box-shadow: 0 0 50px rgba(99,102,241,0.3);
            backdrop-filter: blur(20px);
        }

        .terminal-header {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            border-bottom: 1px solid rgba(99,102,241,0.2);
        }

        .terminal-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .terminal-btn.red { background: #ef4444; }
        .terminal-btn.yellow { background: #f59e0b; }
        .terminal-btn.green { background: #10b981; }

        .terminal-body {
            padding: 15px;
        }

        .terminal-prompt {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .terminal-icon {
            font-size: 1.5rem;
        }

        .terminal-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #22d3ee;
            font-family: 'Consolas', monospace;
            font-size: 1.1rem;
            outline: none;
        }

        .terminal-input::placeholder {
            color: #64748b;
        }

        /* Agent Status */
        .agent-status {
            position: fixed;
            top: 80px;
            left: 30px;
            z-index: 100;
            background: rgba(18,18,26,0.9);
            border: 1px solid rgba(99,102,241,0.3);
            border-radius: 16px;
            padding: 20px;
            min-width: 220px;
        }

        .agent-avatar {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, #6366f1, #22d3ee);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 0 40px rgba(99,102,241,0.5);
            animation: avatarPulse 3s infinite;
        }

        @keyframes avatarPulse {
            0%, 100% { box-shadow: 0 0 40px rgba(99,102,241,0.5); }
            50% { box-shadow: 0 0 60px rgba(99,102,241,0.8), 0 0 100px rgba(34,211,238,0.3); }
        }

        .agent-name {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .agent-task {
            text-align: center;
            font-size: 0.85rem;
            color: #22d3ee;
        }

        /* CAD Info */
        .cad-info {
            position: fixed;
            top: 80px;
            right: 30px;
            z-index: 100;
            background: rgba(18,18,26,0.9);
            border: 1px solid rgba(34,211,238,0.3);
            border-radius: 12px;
            padding: 15px 20px;
            font-family: 'Consolas', monospace;
            font-size: 0.85rem;
        }

        .cad-info div {
            margin: 6px 0;
        }

        .cad-info span {
            color: #22d3ee;
        }

        /* Response Display */
        .response-display {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99;
            width: 700px;
            max-height: 300px;
            overflow-y: auto;
            background: rgba(18,18,26,0.95);
            border: 1px solid rgba(99,102,241,0.3);
            border-radius: 16px;
            padding: 20px;
            display: none;
        }

        .response-display.show { display: block; }

        .response-content {
            font-family: 'Consolas', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .response-close {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            color: #64748b;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .response-close:hover { color: #ef4444; }

        /* Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #6366f1;
            border-radius: 50%;
            opacity: 0.5;
        }

        /* Quick Commands */
        .quick-cmds {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 10px;
        }

        .quick-btn {
            padding: 8px 16px;
            background: rgba(99,102,241,0.2);
            border: 1px solid rgba(99,102,241,0.4);
            border-radius: 20px;
            color: #f1f5f9;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quick-btn:hover {
            background: #6366f1;
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(99,102,241,0.4);
        }

        /* Loading Effect */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-gear {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #6366f1, #22d3ee);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            animation: gearSpin 2s linear infinite;
            box-shadow: 0 0 50px rgba(99,102,241,0.8);
        }

        .loading-text {
            margin-top: 30px;
            font-size: 1.2rem;
            color: #22d3ee;
            animation: textPulse 1.5s infinite;
        }

        @keyframes textPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Scanlines */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.1) 0px,
                rgba(0,0,0,0.1) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            opacity: 0.3;
        }

        /* Vignette */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 49;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.5) 100%);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- Loading -->
    <div class="loading-overlay" id="loading">
        <div class="loading-gear">⚙️</div>
        <div class="loading-text">Initializing SAI Rolotech Engine...</div>
    </div>

    <!-- Effects -->
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <!-- Particles Background -->
    <div class="particles" id="particles"></div>

    <!-- 3D Canvas -->
    <canvas id="webgl-canvas"></canvas>

    <!-- HUD: Top Bar -->
    <div class="hud top-bar">
        <div class="logo">
            <div class="logo-gear">⚙️</div>
            <div class="logo-text">
                <h1>SAI Rolotech Engine</h1>
                <span>3D Agent Workspace</span>
            </div>
        </div>
        <div class="status-panel">
            <div class="status-item">
                <div class="status-dot green"></div>
                <span>Agent Active</span>
            </div>
            <div class="status-item">
                <div class="status-dot cyan"></div>
                <span>3D Render</span>
            </div>
            <div class="status-item">
                <div class="status-dot yellow"></div>
                <span id="status-text">Ready</span>
            </div>
        </div>
    </div>

    <!-- Agent Status -->
    <div class="agent-status">
        <div class="agent-avatar" id="agent-face">🤖</div>
        <div class="agent-name">SAI Engine</div>
        <div class="agent-task" id="current-task">Ready to assist</div>
    </div>

    <!-- CAD Info -->
    <div class="cad-info">
        <div>VIEW: <span id="view-mode">PERSPECTIVE</span></div>
        <div>SCALE: <span>1:1</span></div>
        <div>UNITS: <span>MM</span></div>
        <div>LAYER: <span id="current-layer">0</span></div>
        <div>MEMORY: <span id="memory-usage">128MB</span></div>
    </div>

    <!-- Response Display -->
    <div class="response-display" id="response-display">
        <button class="response-close" onclick="closeResponse()">×</button>
        <div class="response-content" id="response-content"></div>
    </div>

    <!-- Quick Commands -->
    <div class="quick-cmds">
        <button class="quick-btn" onclick="executeCmd('cad circle')">📐 CAD</button>
        <button class="quick-btn" onclick="executeCmd('code hello')">💻 Code</button>
        <button class="quick-btn" onclick="executeCmd('edit fade')">🎬 Edit</button>
        <button class="quick-btn" onclick="executeCmd('help')">❓ Help</button>
    </div>

    <!-- Command Terminal -->
    <div class="command-terminal">
        <div class="terminal-header">
            <div class="terminal-btn red"></div>
            <div class="terminal-btn yellow"></div>
            <div class="terminal-btn green"></div>
        </div>
        <div class="terminal-body">
            <div class="terminal-prompt">
                <span class="terminal-icon">❯</span>
                <input type="text" class="terminal-input" id="cmd-input" placeholder="Type command or ask anything..." onkeypress="handleEnter(event)">
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 3D Scene
        let scene, camera, renderer, agent, grid, clock;
        let particles = [];
        let mouseX = 0, mouseY = 0;

        function init3D() {
            const canvas = document.getElementById('webgl-canvas');
            scene = new THREE.Scene();
            clock = new THREE.Clock();

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 15);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Lights
            const ambient = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambient);

            const mainLight = new THREE.DirectionalLight(0xffffff, 1);
            mainLight.position.set(5, 10, 5);
            scene.add(mainLight);

            const accentLight = new THREE.PointLight(0x6366f1, 1, 50);
            accentLight.position.set(-5, 5, 5);
            scene.add(accentLight);

            const cyanLight = new THREE.PointLight(0x22d3ee, 0.8, 50);
            cyanLight.position.set(5, 3, -5);
            scene.add(cyanLight);

            // Grid
            const gridGeom = new THREE.GridHelper(30, 30, 0x6366f1, 0x1a1a2e);
            grid = new THREE.Mesh(gridGeom);
            scene.add(grid);

            // Create Agent
            createAgent();

            // Create particles
            createParticles();

            // Events
            window.addEventListener('resize', onResize);
            document.addEventListener('mousemove', onMouseMove);

            // Start
            animate();

            // Hide loading
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 2000);
        }

        function createAgent() {
            agent = new THREE.Group();

            // Body
            const bodyGeom = new THREE.BoxGeometry(2, 3, 1);
            const bodyMat = new THREE.MeshPhongMaterial({
                color: 0x6366f1,
                emissive: 0x1a1a2e,
                shininess: 100
            });
            const body = new THREE.Mesh(bodyGeom, bodyMat);
            body.position.y = 1.5;
            agent.add(body);

            // Head
            const headGeom = new THREE.BoxGeometry(1.5, 1.5, 1.2);
            const headMat = new THREE.MeshPhongMaterial({
                color: 0x6366f1,
                emissive: 0x1a1a2e
            });
            const head = new THREE.Mesh(headGeom, headMat);
            head.position.y = 4;
            agent.add(head);

            // Eyes (glowing)
            const eyeGeom = new THREE.SphereGeometry(0.15, 16, 16);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x22d3ee });

            const leftEye = new THREE.Mesh(eyeGeom, eyeMat);
            leftEye.position.set(-0.35, 4.2, 0.65);
            agent.add(leftEye);

            const rightEye = new THREE.Mesh(eyeGeom, eyeMat);
            rightEye.position.set(0.35, 4.2, 0.65);
            agent.add(rightEye);

            // Antenna
            const antennaGeom = new THREE.CylinderGeometry(0.05, 0.05, 0.8);
            const antennaMat = new THREE.MeshPhongMaterial({ color: 0x22d3ee });
            const antenna = new THREE.Mesh(antennaGeom, antennaMat);
            antenna.position.y = 5.2;
            agent.add(antenna);

            // Antenna tip
            const tipGeom = new THREE.SphereGeometry(0.12);
            const tipMat = new THREE.MeshBasicMaterial({ color: 0x22d3ee });
            const tip = new THREE.Mesh(tipGeom, tipMat);
            tip.position.y = 5.7;
            agent.add(tip);

            // Arms
            const armGeom = new THREE.BoxGeometry(0.4, 2, 0.4);
            const armMat = new THREE.MeshPhongMaterial({ color: 0x4f46e5 });

            const leftArm = new THREE.Mesh(armGeom, armMat);
            leftArm.position.set(-1.3, 1.8, 0);
            agent.add(leftArm);

            const rightArm = new THREE.Mesh(armGeom, armMat);
            rightArm.position.set(1.3, 1.8, 0);
            agent.add(rightArm);

            // Legs
            const legGeom = new THREE.BoxGeometry(0.5, 1.5, 0.5);
            const leftLeg = new THREE.Mesh(legGeom, armMat);
            leftLeg.position.set(-0.5, -0.75, 0);
            agent.add(leftLeg);

            const rightLeg = new THREE.Mesh(legGeom, armMat);
            rightLeg.position.set(0.5, -0.75, 0);
            agent.add(rightLeg);

            // Torso glow
            const torsoGlowGeom = new THREE.PlaneGeometry(0.8, 0.8);
            const torsoGlowMat = new THREE.MeshBasicMaterial({
                color: 0x22d3ee,
                transparent: true,
                opacity: 0.8
            });
            const torsoGlow = new THREE.Mesh(torsoGlowGeom, torsoGlowMat);
            torsoGlow.position.set(0, 1.5, 0.55);
            agent.add(torsoGlow);

            scene.add(agent);
        }

        function createParticles() {
            for (let i = 0; i < 100; i++) {
                const geom = new THREE.SphereGeometry(0.03 + Math.random() * 0.03);
                const mat = new THREE.MeshBasicMaterial({
                    color: Math.random() > 0.5 ? 0x6366f1 : 0x22d3ee,
                    transparent: true,
                    opacity: 0.3 + Math.random() * 0.4
                });
                const particle = new THREE.Mesh(geom, mat);
                particle.position.set(
                    (Math.random() - 0.5) * 40,
                    Math.random() * 20,
                    (Math.random() - 0.5) * 40
                );
                particle.userData = {
                    speed: 0.005 + Math.random() * 0.015,
                    originalY: particle.position.y
                };
                scene.add(particle);
                particles.push(particle);
            }
        }

        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onMouseMove(e) {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = (e.clientY / window.innerHeight) * 2 - 1;
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            // Agent animations
            if (agent) {
                // Floating
                agent.position.y = Math.sin(time * 2) * 0.3;

                // Look at mouse
                agent.rotation.y = Math.sin(time * 0.5) * 0.1 + mouseX * 0.3;
                agent.children.forEach((child, i) => {
                    if (i >= 2 && i <= 3) { // Eyes
                        child.material.emissive = new THREE.Color(0x22d3ee);
                    }
                });
            }

            // Particles
            particles.forEach(p => {
                p.position.y = p.userData.originalY + Math.sin(time + p.position.x) * 2;
                p.rotation.x += p.userData.speed;
                p.rotation.y += p.userData.speed;
            });

            // Grid pulse
            if (grid) {
                grid.material.opacity = 0.3 + Math.sin(time * 2) * 0.1;
            }

            // Camera subtle movement
            camera.position.x = Math.sin(time * 0.2) * 2;
            camera.position.y = 5 + Math.sin(time * 0.3) * 0.5;
            camera.lookAt(0, 2, 0);

            renderer.render(scene, clock);
        }

        // Particles background
        function createParticleBackground() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 5 + 's';
                p.style.animation = `float ${5 + Math.random() * 10}s infinite`;
                container.appendChild(p);
            }
        }

        // Command handling
        function handleEnter(e) {
            if (e.key === 'Enter') {
                const cmd = document.getElementById('cmd-input').value.trim();
                if (cmd) executeCmd(cmd);
            }
        }

        function executeCmd(cmd) {
            const statusText = document.getElementById('status-text');
            const currentTask = document.getElementById('current-task');
            const responseDisplay = document.getElementById('response-display');
            const responseContent = document.getElementById('response-content');

            // Update status
            statusText.textContent = 'Processing...';
            currentTask.textContent = cmd.toUpperCase();

            // Show response
            responseDisplay.classList.add('show');

            // Generate response
            let response = '';
            const lowerCmd = cmd.toLowerCase();

            if (lowerCmd.includes('cad') || lowerCmd.includes('circle') || lowerCmd.includes('draw')) {
                response = `AutoCAD Command: CIRCLE
═══════════════════════════════════

Type: CIRCLE (or C)
Shortcut: C

Steps:
1. Command: CIRCLE ↵
2. Specify center point: [click]
3. Specify radius: [type value] ↵

LISP Example:
═══════════════════════════════════
(defun c:DRAWCIRCLE (/ pt r)
  (setq pt (getpoint "\\nCenter: "))
  (setq r (getdist pt "\\nRadius: "))
  (command "CIRCLE" pt r)
  (princ)
)

Tip: Use R for radius, D for diameter`;
                document.getElementById('view-mode').textContent = 'TOP';
                document.getElementById('current-layer').textContent = 'OBJECTS';
            } else if (lowerCmd.includes('code') || lowerCmd.includes('hello')) {
                response = `Code Generated:
═══════════════════════════════════

# Hello World in Python

def greet(name):
    """Greet the user"""
    return f"Namaste, {name}!"

if __name__ == "__main__":
    print(greet("SAI Rolotech"))
    print("Engine running at full speed!")`;
                document.getElementById('view-mode').textContent = 'CODE';
            } else if (lowerCmd.includes('edit') || lowerCmd.includes('video')) {
                response = `Video Editing Guide:
═══════════════════════════════════

Filmora Fade Transition:

1. Select clip on timeline
2. Go to Transitions > Fade
3. Drag "Fade to Black" between clips
4. Adjust Duration: 0.5s - 2s
5. Preview and adjust

Key Shortcuts:
• C - Razor/Cut tool
• V - Selection tool
• B/N - Ripple cuts
• Delete - Remove clip

Pro Tip: Cross-dissolve = smooth flow`;
                document.getElementById('view-mode').textContent = 'TIMELINE';
            } else if (lowerCmd.includes('help')) {
                response = `SAI Rolotech Engine - Commands
═══════════════════════════════════

Type your request naturally!

Examples:
• "cad circle" - AutoCAD help
• "code hello world" - Write code
• "edit fade" - Video editing
• "draw rectangle" - CAD guide

Or ask any question directly!`;
            } else {
                response = `Processing: "${cmd}"
═══════════════════════════════════

I'm SAI Rolotech Engine - your AI assistant!

I specialize in:
• Roll Forming Engineering
• AutoCAD & CAD/CAM
• Video Editing (Filmora)
• Industrial Automation
• Programming (Python, JS...)

Try: "cad circle" or "help"`;
            }

            responseContent.textContent = response;

            // Update memory display
            document.getElementById('memory-usage').textContent =
                Math.floor(128 + Math.random() * 100) + 'MB';

            // Reset after delay
            setTimeout(() => {
                statusText.textContent = 'Ready';
                currentTask.textContent = 'Ready to assist';
                document.getElementById('cmd-input').value = '';
            }, 1000);
        }

        function closeResponse() {
            document.getElementById('response-display').classList.remove('show');
        }

        // Init
        window.addEventListener('load', () => {
            init3D();
            createParticleBackground();
        });
    </script>
</body>
</html>
